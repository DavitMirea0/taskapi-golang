services:
        db:
                image: postgres:16-alpine
                environment:
                        POSTGRES_USER: taskapi
                        POSTGRES_PASSWORD: taskapi
                        POSTGRES_DB: taskapi
                ports:
                        - "5433:5432"
                volumes:
                        - pgdata:/var/lib/postgresql/data
                        - ./migrations:/docker-entrypoint-initdb.d
                healthcheck:
                        test: ["CMD-SHELL", "pg_isready -U taskapi"]
                        interval: 5s
                        timeout: 3s
                        retries: 10

        api:
                build: .
                ports:
                        - "8080:8080"
                environment:
                        DATABASE_URL: postgres://taskapi:taskapi@db:5432/taskapi?sslmode=disable
                        JWT_SECRET: change-me-in-real-env
                depends_on:
                        db:
                                condition: service_healthy

volumes:
        pgdata: